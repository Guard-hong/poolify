# 动态线程池配置
poolify:
  executors:
    - thread-pool-name: dtp1
      queue-timeout: 100
      run-timeout: 100
      core-pool-size: 10
      maximum-pool-size: 20
      keep-alive-time: 100
  management:
    enabled: true
    addr: http://localhost:8091
    collection-cron: "0/10 * * * * ?"
  registry:
    type: nacos
    nacos:
      host: localhost
      port: 8848
#      group-id:
  web:
    context-path: /api
